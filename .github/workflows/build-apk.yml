name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build debug APK
        run: |
          mkdir -p www ~/.android
          cp debug.keystore ~/.android/debug.keystore
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/
          npm install
          npx cap add android
          pip install pillow
          python3 make_icons.py
          mkdir -p android/app/src/main/java/com/rit/iot
          sed 's/package com.rit.control;/package com.rit.iot;/' MainActivity.java > android/app/src/main/java/com/rit/iot/MainActivity.java
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><application#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RIT-IOT-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
